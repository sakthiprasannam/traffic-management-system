services:
  - type: web
    name: trafficai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URL
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.0"
